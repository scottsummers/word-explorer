<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Explorer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    body { font-family: "Nunito", sans-serif; }

    /* Self-hosted Fredoka and Nunito (SIL Open Font License 1.1; see fonts/).
       Files, subsets, and unicode-range values match the Google Fonts CSS
       the game previously loaded from fonts.googleapis.com. Both families
       are variable fonts, so one file per subset covers all used weights. */
    /* hebrew */
    @font-face {
      font-family: 'Fredoka';
      font-style: normal;
      font-weight: 400 700;
      font-stretch: 100%;
      font-display: swap;
      src: url('fonts/fredoka-hebrew.woff2') format('woff2');
      unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
    }
    /* latin-ext */
    @font-face {
      font-family: 'Fredoka';
      font-style: normal;
      font-weight: 400 700;
      font-stretch: 100%;
      font-display: swap;
      src: url('fonts/fredoka-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* latin */
    @font-face {
      font-family: 'Fredoka';
      font-style: normal;
      font-weight: 400 700;
      font-stretch: 100%;
      font-display: swap;
      src: url('fonts/fredoka-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    /* cyrillic-ext */
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/nunito-cyrillic-ext.woff2') format('woff2');
      unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
    }
    /* cyrillic */
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/nunito-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    /* vietnamese */
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/nunito-vietnamese.woff2') format('woff2');
      unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
    }
    /* latin-ext */
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/nunito-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* latin */
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/nunito-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="text-align:center;padding:60px 20px;font-family:sans-serif;">
      <p style="font-size:24px;">Loading Word Explorer...</p>
      <p style="color:#888;margin-top:12px;">Make sure you are connected to the internet.</p>
    </div>
  </div>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
