// Search/filter words from bank
function searchWords(letters, length, mode) {
  const bank = WORD_BANK[length] || [];
  if (!letters.trim()) return bank.slice(0, 60);
  // Support comma-separated letters like "M,A,P,T" or just "mapt"
  let chars;
  if (letters.includes(",")) {
    chars = letters.split(",").map(s => s.trim().toLowerCase()).filter(s => /^[a-z]$/.test(s));
  } else {
    const lower = letters.toLowerCase().replace(/[^a-z]/g, "");
    chars = lower.split("");
  }
  if (chars.length === 0) return bank.slice(0, 60);
  const charSet = new Set(chars);

  if (mode === "only") {
    // ONLY mode: every letter in the word must come from the given set
    return bank.filter(w => {
      for (const ch of w) {
        if (!charSet.has(ch)) return false;
      }
      return true;
    }).slice(0, 100);
  } else {
    // ANY mode: word must contain at least one of the specified letters
    return bank.filter(w => {
      for (const ch of chars) {
        if (w.includes(ch)) return true;
      }
      return false;
    }).slice(0, 100);
  }
}

// Main App
function WordleForLearners() {
  const [mode, setMode] = useState("setup"); // setup | play | done
  const [wordLength, setWordLength] = useState(4);
  const [wordList, setWordList] = useState([]);
  const [customInput, setCustomInput] = useState("");
  const [searchInput, setSearchInput] = useState("");
  const [searchMode, setSearchMode] = useState("only"); // "only" or "any"
  const [lessonLetters, setLessonLetters] = useState(""); // the letters for this lesson
  const [currentWordIndex, setCurrentWordIndex] = useState(0);
  const [playOrder, setPlayOrder] = useState([]);
  const [guesses, setGuesses] = useState([]);
  const [currentGuess, setCurrentGuess] = useState("");
  const [shake, setShake] = useState(false);
  const [revealRow, setRevealRow] = useState(-1);
  const [gameStatus, setGameStatus] = useState("playing"); // playing | won | lost
  const [letterStates, setLetterStates] = useState({});
  const [showSuccess, setShowSuccess] = useState(false);
  const [results, setResults] = useState([]);
  const [showWordPicker, setShowWordPicker] = useState(false);
  const maxGuesses = 6;

  const actualIndex = playOrder.length > 0 ? playOrder[currentWordIndex] : currentWordIndex;
  const targetWord = wordList[actualIndex] ? wordList[actualIndex].toUpperCase() : "";

  // Evaluate a guess against target
  const evaluate = useCallback((guess, target) => {
    const result = Array(guess.length).fill("absent");
    const targetArr = target.split("");
    const guessArr = guess.split("");
    // First pass: correct
    for (let i = 0; i < guessArr.length; i++) {
      if (guessArr[i] === targetArr[i]) {
        result[i] = "correct";
        targetArr[i] = null;
        guessArr[i] = null;
      }
    }
    // Second pass: present
    for (let i = 0; i < guessArr.length; i++) {
      if (guessArr[i] === null) continue;
      const idx = targetArr.indexOf(guessArr[i]);
      if (idx !== -1) {
        result[i] = "present";
        targetArr[idx] = null;
      }
    }
    return result;
  }, []);

  // Submit guess
  const submitGuess = useCallback(() => {
    if (currentGuess.length !== wordLength || gameStatus !== "playing") return;

    const result = evaluate(currentGuess, targetWord);
    const newGuesses = [...guesses, { word: currentGuess, result }];
    setGuesses(newGuesses);
    setRevealRow(newGuesses.length - 1);
    setCurrentGuess("");

    // Update letter states
    const newStates = { ...letterStates };
    for (let i = 0; i < currentGuess.length; i++) {
      const letter = currentGuess[i];
      const state = result[i];
      if (state === "correct") newStates[letter] = "correct";
      else if (state === "present" && newStates[letter] !== "correct") newStates[letter] = "present";
      else if (!newStates[letter]) newStates[letter] = "absent";
    }
    setLetterStates(newStates);

    // Check win/lose
    if (currentGuess === targetWord) {
      setTimeout(() => {
        setGameStatus("won");
        setShowSuccess(true);
      }, wordLength * 300 + 200);
    } else if (newGuesses.length >= maxGuesses) {
      setTimeout(() => setGameStatus("lost"), wordLength * 300 + 200);
    }
  }, [currentGuess, wordLength, targetWord, guesses, gameStatus, letterStates, evaluate]);

  // Handle keyboard
  const handleKey = useCallback((key) => {
    if (gameStatus !== "playing") return;
    if (key === "ENTER") {
      if (currentGuess.length === wordLength) submitGuess();
      else { setShake(true); setTimeout(() => setShake(false), 500); }
    } else if (key === "⌫" || key === "BACKSPACE") {
      setCurrentGuess(prev => prev.slice(0, -1));
    } else if (/^[A-Z]$/.test(key) && currentGuess.length < wordLength) {
      setCurrentGuess(prev => prev + key);
    }
  }, [currentGuess, wordLength, gameStatus, submitGuess]);

  // Physical keyboard
  useEffect(() => {
    if (mode !== "play") return;
    const handler = (e) => {
      const k = e.key.toUpperCase();
      if (k === "ENTER" || k === "BACKSPACE" || (/^[A-Z]$/.test(k) && k.length === 1)) {
        e.preventDefault();
        handleKey(k);
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [mode, handleKey]);

  // Move to next word
  const nextWord = () => {
    const r = { word: targetWord, guesses: guesses.length, won: gameStatus === "won" };
    setResults(prev => [...prev, r]);
    if (currentWordIndex + 1 < wordList.length) {
      setCurrentWordIndex(prev => prev + 1);
      setGuesses([]);
      setCurrentGuess("");
      setGameStatus("playing");
      setLetterStates({});
      setRevealRow(-1);
      setShowSuccess(false);
    } else {
      setResults(prev => [...prev.slice(0, -1), r]);
      setMode("done");
    }
  };

  // Add word to list
  const addWord = (w) => {
    const clean = w.toLowerCase().replace(/[^a-z]/g, "");
    if (clean.length !== wordLength) return;
    if (wordList.includes(clean)) return;
    setWordList(prev => [...prev, clean]);
    setCustomInput("");
  };

  const removeWord = (idx) => setWordList(prev => prev.filter((_, i) => i !== idx));

  const startGame = () => {
    if (wordList.length === 0) return;
    // Shuffle: create array of indices and randomize
    var indices = [];
    for (var i = 0; i < wordList.length; i++) indices.push(i);
    for (var j = indices.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var temp = indices[j];
      indices[j] = indices[k];
      indices[k] = temp;
    }
    setPlayOrder(indices);
    setCurrentWordIndex(0);
    setGuesses([]);
    setCurrentGuess("");
    setGameStatus("playing");
    setLetterStates({});
    setRevealRow(-1);
    setShowSuccess(false);
    setResults([]);
    setMode("play");
  };

  const resetAll = () => {

    setSearchInput("");
    setLessonLetters("");
    setPlayOrder([]);
    setCurrentWordIndex(0);
    setGuesses([]);
    setCurrentGuess("");
    setGameStatus("playing");
    setLetterStates({});
    setRevealRow(-1);
    setShowSuccess(false);
    setResults([]);
  };

              <span style={styles.stepBadge}>3</span>
              Pick Words for the Lesson
            </h2>

            {/* Search mode toggle */}
            <div style={styles.modeToggle}>
              <button
                onClick={() => setSearchMode("only")}
                style={{
                  ...styles.modeBtn,
                  ...(searchMode === "only" ? styles.modeBtnActive : {}),
                }}
              >
                🎯 Made from ONLY these letters
              </button>
              <button
                onClick={() => setSearchMode("any")}
                style={{
                  ...styles.modeBtn,
                  ...(searchMode === "any" ? styles.modeBtnActive : {}),
                }}
              >
                🔍 Contains ANY of these letters
              </button>
            </div>

            {/* Results count */}
            {searchInput.trim() && suggestions.length > 0 && (
              <p style={{ fontSize: "14px", color: colors.textLight, margin: "12px 0 6px", fontWeight: 700 }}>
                {searchMode === "only" ? "🎯 " : "🔍 "}
                {suggestions.length} words found
                {suggestions.length >= 100 ? " (showing first 100)" : ""}
                {suggestions.length > 0 && (
                  <button
                    onClick={() => {
                      const newWords = suggestions.filter(w => w.length === wordLength && !wordList.includes(w));
                      setWordList(prev => [...prev, ...newWords]);
                    }}
                    style={styles.addAllBtn}
                  >
                    Add All ✓
                  </button>
                )}
              </p>
            )}
            {searchInput.trim() && suggestions.length === 0 && (
              <p style={{ fontSize: "14px", color: colors.primary, margin: "12px 0 6px", fontWeight: 600 }}>
                No words found — {searchMode === "only" ? "try adding more letters above!" : "try different letters!"}
              </p>
            )}

            {/* Suggestions grid */}
            <div style={styles.suggestionsGrid}>
              {suggestions.map(w => {
                const added = wordList.includes(w);
                return (
                  <button
                    key={w}
                    onClick={() => !added && addWord(w)}
                    style={{
                      ...styles.suggestionChip,
                      ...(added ? styles.suggestionChipAdded : {}),
                    }}
                    disabled={added}
                  >
                    {w.toUpperCase()}
                    {added && <span style={styles.checkMark}> ✓</span>}
                  </button>
                );
              })}
              {!searchInput.trim() && (
                <p style={styles.noResults}>Enter your lesson letters in Step 2 to see matching words here!</p>
              )}
            </div>

            {/* Divider for custom entry */}
            <div style={styles.divider}>
              <span style={styles.dividerText}>or add a custom word</span>
            </div>

            <div style={styles.inputRow}>
              <input
                type="text"
                value={customInput}
                onChange={e => setCustomInput(e.target.value.replace(/[^a-zA-Z]/g, "").slice(0, wordLength))}
                onKeyDown={e => { if (e.key === "Enter") addWord(customInput); }}
                placeholder={`Type a ${wordLength}-letter word...`}
                style={styles.textInput}
                maxLength={wordLength}
              />
              <button
                onClick={() => addWord(customInput)}
                disabled={customInput.length !== wordLength}
                style={{
                  ...styles.addBtn,
                  ...(customInput.length !== wordLength ? styles.addBtnDisabled : {}),
                }}
              >
                Add ✓
              </button>
            </div>
          </div>

          {/* Step 4: Word List & Play */}
          <div style={styles.card}>
            <h2 style={styles.cardTitle}>
              <span style={styles.stepBadge}>4</span>
              Your Words ({wordList.length})
            </h2>
            {wordList.length === 0 ? (
              <p style={styles.emptyList}>Pick some words above to get started!</p>
            ) : (
              <div style={styles.wordListGrid}>
                {wordList.map((w, i) => (
                  <div key={i} style={styles.wordListItem} className="word-item">
                    <span style={styles.wordListWord}>{w.toUpperCase()}</span>
                    <button onClick={() => removeWord(i)} style={styles.removeBtn}>✕</button>
                  </div>
                ))}
              </div>
            )}
            {wordList.length > 0 && (
              <button onClick={startGame} style={styles.playButton}>
                🎮 Let's Play! ({wordList.length} word{wordList.length !== 1 ? "s" : ""})
              </button>
            )}
          </div>
        </div>
      )}

      {/* PLAY MODE */}
      {mode === "play" && (
        <div style={styles.playOuter} className="play-outer-responsive">
          {/* Word Bank Sidebar */}
          <div style={styles.wordBankSidebar} className="word-bank-responsive">
            <div style={styles.wordBankHeader}>
              <span style={{ fontSize: "20px" }}>📖</span>
              <span style={styles.wordBankTitle}>Word Bank</span>
            </div>
            <div style={styles.wordBankList} className="word-bank-list-responsive">
              {wordList.map((w, i) => {
                const isFound = results.some(function(r) { return r.word === w.toUpperCase() && r.won; });
                return (
                  <div
                    key={i}
                    style={{
                      ...styles.wordBankItem,
                      ...(isFound ? styles.wordBankItemFound : {}),
                    }}
                  >
                    <span style={{
                      ...styles.wordBankWord,
                      ...(isFound ? { textDecoration: "line-through", opacity: 0.5 } : {}),
                    }}>{w.toUpperCase()}</span>
                    {isFound && (
                      <span style={{ fontSize: "16px" }}>✅</span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Main Game Area */}
          <div style={styles.playContainer}>
            {/* Lesson Letters Display */}
            {lessonLetters.trim() && (() => {
              let chars;
              if (lessonLetters.includes(",")) {
                chars = lessonLetters.split(",").map(s => s.trim().toUpperCase()).filter(s => /^[A-Z]$/.test(s));
              } else {
                chars = lessonLetters.toUpperCase().replace(/[^A-Z]/g, "").split("");
              }
              chars = [...new Set(chars)];
              if (chars.length === 0) return null;
              return (
                <div style={styles.playLettersBar}>
                  <span style={styles.playLettersLabel}>Your Letters:</span>
                  <div style={styles.playLettersRow}>
                    {chars.map((ch, i) => (
                      <div key={i} style={styles.playLetterBox}>{ch}</div>
                    ))}
                  </div>
                </div>
              );
            })()}

            {/* Grid */}
            <div style={styles.gridWrapper}>
              {Array.from({ length: maxGuesses }).map((_, rowIdx) => {
                const guess = guesses[rowIdx];
                const isCurrent = rowIdx === guesses.length && gameStatus === "playing";
                const isShaking = isCurrent && shake;
                const isRevealing = rowIdx === revealRow;

                return (
                  <div
                    key={rowIdx}
                    style={{
                      ...styles.row,
                      ...(isShaking ? { animation: "shakeRow 0.5s ease" } : {}),
                    }}
                  >
                    {Array.from({ length: wordLength }).map((_, colIdx) => {
                      let letter = "";
                      let cellStyle = styles.cellEmpty;

                      if (guess) {
                        letter = guess.word[colIdx];
                        const state = guess.result[colIdx];
                        cellStyle = state === "correct" ? styles.cellCorrect
                          : state === "present" ? styles.cellPresent
                          : styles.cellAbsent;
                        if (isRevealing) {
                          cellStyle = {
                            ...cellStyle,
                            animation: `flipIn 0.5s ease ${colIdx * 0.15}s both`,
                          };
                        }
                      } else if (isCurrent) {
                        letter = currentGuess[colIdx] || "";
                        const isFullMatch = currentGuess.length === wordLength &&
                          wordList.some(function(w) { return w.toUpperCase() === currentGuess; });
                        if (letter) {
                          if (isFullMatch) {
                            cellStyle = {
                              ...styles.cellMatch,
                              animation: "popIn 0.15s ease",
                            };
                          } else {
                            cellStyle = {
                              ...styles.cellFilled,
                              animation: "popIn 0.15s ease",
                            };
                          }
                        }
                      }

                      return (
                        <div key={colIdx} style={{ ...styles.cell, ...cellStyle }}>
                          <span style={styles.cellLetter}>{letter}</span>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>

            {/* Match hint */}
            {gameStatus === "playing" && currentGuess.length === wordLength &&
              wordList.some(function(w) { return w.toUpperCase() === currentGuess; }) && (
              <div style={styles.matchHint}>
                ✨ That's a word! Press <strong>✓</strong> to submit!
              </div>
            )}

            {/* Win/Lose overlay */}
            {gameStatus === "won" && showSuccess && (
              <div style={styles.resultOverlay}>
                <div style={{ ...styles.resultCard, animation: "bounceIn 0.6s ease" }}>
                  <div style={styles.confettiContainer}>
                    {["🌟","⭐","🎉","💫","✨","🌈","🎊","💖"].map((e, i) => (
                      <span key={i} style={{
                        position: "absolute",
                        fontSize: "24px",
                        left: `${10 + (i * 12)}%`,
                        top: "20%",
                        animation: `confetti 1.5s ease ${i * 0.1}s forwards`,
                      }}>{e}</span>
                    ))}
                  </div>
                  <div style={styles.resultEmoji}>🎉</div>
                  <h2 style={styles.resultTitle}>Amazing Job!</h2>
                  <p style={styles.resultText}>
                    You found <strong>{targetWord}</strong> in {guesses.length} {guesses.length === 1 ? "try" : "tries"}!
                  </p>
                  <button onClick={nextWord} style={styles.nextButton}>
                    {currentWordIndex + 1 < wordList.length ? "Next Word →" : "See Results 🏆"}
                  </button>
                </div>
              </div>
            )}

            {gameStatus === "lost" && (
              <div style={styles.resultOverlay}>
                <div style={{ ...styles.resultCard, animation: "bounceIn 0.6s ease" }}>
                  <div style={styles.resultEmoji}>💪</div>
                  <h2 style={styles.resultTitle}>Good Try!</h2>
                  <p style={styles.resultText}>
                    The word was <strong>{targetWord}</strong>. Keep going, you're doing great!
                  </p>
                  <button onClick={nextWord} style={styles.nextButton}>
                    {currentWordIndex + 1 < wordList.length ? "Next Word →" : "See Results 🏆"}
                  </button>
                </div>
              </div>
            )}

            {/* Keyboard */}
            <div style={styles.keyboard}>
              {(() => {
                // Compute lesson letter set for highlighting
                let lessonSet = new Set();
                if (lessonLetters.trim()) {
                  let chars;
                  if (lessonLetters.includes(",")) {
                    chars = lessonLetters.split(",").map(s => s.trim().toUpperCase()).filter(s => /^[A-Z]$/.test(s));
                  } else {
                    chars = lessonLetters.toUpperCase().replace(/[^A-Z]/g, "").split("");
                  }
                  lessonSet = new Set(chars);
                }
                return KEYBOARD_ROWS.map((row, ri) => (
                  <div key={ri} style={styles.keyboardRow}>
                    {row.map(key => {
                      const state = letterStates[key];
                      const isLesson = lessonSet.size > 0 && lessonSet.has(key);
                      const isNonLesson = lessonSet.size > 0 && !lessonSet.has(key) && key !== "ENTER" && key !== "⌫";
                      let keyStyle = styles.key;
                      if (key === "ENTER") keyStyle = { ...styles.key, ...styles.keyWide, ...styles.keyEnter };
                      else if (key === "⌫") keyStyle = { ...styles.key, ...styles.keyWide, ...styles.keyDelete };
                      else if (state === "correct") keyStyle = { ...styles.key, ...styles.keyCorrect };
                      else if (state === "present") keyStyle = { ...styles.key, ...styles.keyPresent };
                      else if (state === "absent") keyStyle = { ...styles.key, ...styles.keyAbsent };
                      else if (isLesson) keyStyle = { ...styles.key, ...styles.keyLesson };
                      if (isNonLesson && !state) keyStyle = { ...keyStyle, ...styles.keyDimmed };

                      return (
                        <button
                          key={key}
                          onClick={() => handleKey(key)}
                          style={keyStyle}
                        >
                          {key === "ENTER" ? "✓" : key}
                        </button>
                      );
                    })}
                  </div>
                ));
              })()}
            </div>

            {/* Back button */}
            <button onClick={resetAll} style={styles.backButton}>
              ← Back to Setup
            </button>
          </div>
        </div>
      )}

      {/* DONE MODE */}
      {mode === "done" && (
        <div style={styles.doneContainer}>
          <div style={{ ...styles.doneCard, animation: "slideUp 0.5s ease" }}>
            <div style={styles.resultEmoji}>🏆</div>
            <h2 style={styles.doneTitle}>All Done!</h2>
            <div style={styles.scoreBoard}>
              {[...results, { word: targetWord, guesses: guesses.length, won: gameStatus === "won" }].map((r, i) => (
                <div key={i} style={styles.scoreRow}>
                  <span style={styles.scoreWord}>{r.word}</span>
                  <span style={{
                    ...styles.scoreBadge,
                    ...(r.won ? styles.scoreBadgeWon : styles.scoreBadgeLost),
                  }}>
                    {r.won ? `${r.guesses} ${r.guesses === 1 ? "try" : "tries"} ⭐` : "Keep practicing 💪"}
                  </span>
                </div>
              ))}
            </div>
            <div style={styles.doneStats}>
              <div style={styles.statBox}>
                <span style={styles.statNum}>
                  {[...results, { won: gameStatus === "won" }].filter(r => r.won).length}
                </span>
                <span style={styles.statLabel}>Words Found</span>
              </div>
              <div style={styles.statBox}>
                <span style={styles.statNum}>
                  {[...results, { won: gameStatus === "won" }].length}
                </span>
                <span style={styles.statLabel}>Words Total</span>
              </div>
            </div>
            <button onClick={resetAll} style={styles.playButton}>
              🔄 Play Again
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
